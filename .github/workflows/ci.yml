name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.74.0
          setup_only: true
          # optional, unauthenticated calls to buf.build are rate limited
          token: ${{ secrets.BUF_TOKEN }}
      - name: api lint
        run: make api-lint
      - name: generated code is up to date
        run: |
          make generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "run make generate and commit the result, out of date files:"
            git status --porcelain
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      # cgo is only enabled here because the race detector needs it on linux
      - run: go tool ginkgo --randomize-all --race --label-filter='!e2e' -r
        env:
          CGO_ENABLED: "1"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # starts a kind cluster and a consul container on the docker of the runner
      - run: make test-e2e
